services:
  - type: web
    name: agrirent-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_ORIGIN
        sync: false
      # Phase 4 — push notifications (see backend/README.md "Setting up
      # push notifications"). All optional: unset = /notifications/booking-webhook
      # safely no-ops, per the disclosed fallback in app/notifications.py.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      # Phase 6 item 2 — multilingual semantic double-check (see
      # backend/README.md "Multilingual semantic double-check" and
      # hf-space-semantic/README.md "Deploying this"). Optional: unset =
      # semantic_match.py falls straight to its difflib last resort, per
      # the disclosed fallback in app/semantic_match.py.
      - key: HF_SPACE_URL
        sync: false
      - key: HF_SPACE_API_TOKEN
        sync: false
