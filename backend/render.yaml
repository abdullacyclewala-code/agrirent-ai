services:
  - type: web
    name: agrirent-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: FRONTEND_ORIGIN
        sync: false
      # Phase 4 — push notifications (see backend/README.md "Setting up
      # push notifications"). All optional: unset = /notifications/booking-webhook
      # safely no-ops, per the disclosed fallback in app/notifications.py.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      # Phase 7 — trust layer: vision provider chain, JWT validation and the
      # policy version stamped into settlements. All optional: with none of
      # them set, /verification/* still produces a full report from the
      # deterministic signals and reports ai_status "unavailable" (see
      # app/vision/providers.py).
      - key: VISION_PROVIDER_ORDER
        value: gemini,groq,cloudflare
      - key: GEMINI_VISION_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_VISION_MODEL
        value: meta-llama/llama-4-scout-17b-16e-instruct
      - key: CF_VISION_MODEL
        value: "@cf/meta/llama-3.2-11b-vision-instruct"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: TRUST_POLICY_VERSION
        value: "2026-10-1"

      # Phase 6 item 2 — multilingual semantic double-check, via Cloudflare
      # Workers AI (BGE-M3) (see backend/README.md "Multilingual semantic
      # double-check"). Optional: unset = semantic_match.py falls straight
      # to its difflib last resort, per the disclosed fallback in
      # app/semantic_match.py.
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
